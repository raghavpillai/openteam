<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>OpenTeam computer</title>
    <style>
      html,
      body,
      #screen {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #1b1d1f;
      }

      #screen {
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
      }

      #screen canvas {
        outline: none;
      }
    </style>
    <script type="module">
      import RFB from "./core/rfb.js";

      const query = new URLSearchParams(window.location.search);
      const fragment = new URLSearchParams(window.location.hash.slice(1));
      const credentialKey = `openteam:viewer:${window.location.pathname}`;
      let password = fragment.get("password");
      try {
        // Retain the credential only in this tab so a refresh can reconnect
        // after the fragment has been removed from the visible URL.
        password ??= sessionStorage.getItem(credentialKey);
        if (password) sessionStorage.setItem(credentialKey, password);
      } catch {
        // Restricted embedded browsers can still use the supplied fragment.
      }
      history.replaceState(null, "", `${window.location.pathname}${window.location.search}`);
      const path = query.get("path") ?? "websockify";
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const socketUrl = new URL(`./${path}`, window.location.href);
      socketUrl.protocol = protocol;
      const screen = document.getElementById("screen");
      const viewOnly = query.get("view_only") === "true";
      let rfb = null;
      let reconnectTimer = null;
      let reconnectDelayMs = 500;
      let shouldReconnect = true;

      const setConnectionState = (state) => {
        screen.dataset.connectionState = state;
        window.parent.postMessage({ type: "openteam:screen-connection", state }, "*");
      };

      const scheduleReconnect = () => {
        if (!shouldReconnect || reconnectTimer !== null) return;
        setConnectionState("reconnecting");
        reconnectTimer = window.setTimeout(() => {
          reconnectTimer = null;
          connect();
        }, reconnectDelayMs);
        reconnectDelayMs = Math.min(reconnectDelayMs * 2, 5_000);
      };

      const connect = () => {
        if (!shouldReconnect) return;
        setConnectionState("connecting");
        screen.replaceChildren();
        try {
          const connection = new RFB(screen, socketUrl.toString(), {
            credentials: { password },
          });
          rfb = connection;
          connection.viewOnly = viewOnly;
          connection.scaleViewport = true;
          connection.resizeSession = false;
          connection.focusOnClick = true;
          connection.addEventListener("connect", () => {
            if (rfb !== connection) return;
            reconnectDelayMs = 500;
            setConnectionState("connected");
          });
          connection.addEventListener("disconnect", () => {
            if (rfb !== connection) return;
            rfb = null;
            scheduleReconnect();
          });
          connection.addEventListener("securityfailure", (event) => {
            if (rfb !== connection) return;
            shouldReconnect = false;
            try {
              sessionStorage.removeItem(credentialKey);
            } catch {}
            setConnectionState("authentication-failed");
            console.error("VNC authentication failed", event.detail);
          });
        } catch (error) {
          rfb = null;
          console.error("VNC connection failed", error);
          scheduleReconnect();
        }
      };

      window.addEventListener("online", () => {
        if (rfb || !shouldReconnect) return;
        if (reconnectTimer !== null) window.clearTimeout(reconnectTimer);
        reconnectTimer = null;
        reconnectDelayMs = 500;
        connect();
      });
      window.addEventListener(
        "pagehide",
        () => {
          shouldReconnect = false;
          if (reconnectTimer !== null) window.clearTimeout(reconnectTimer);
          rfb?.disconnect();
        },
        { once: true }
      );
      if (password) connect();
      else setConnectionState("authentication-failed");
    </script>
  </head>
  <body>
    <div id="screen" aria-label="OpenTeam computer screen"></div>
  </body>
</html>
