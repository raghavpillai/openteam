name: WhatsApp plugin

on:
  pull_request:
    paths:
      - "packages/plugins/whatsapp/**"
      - "packages/plugins/_shared/**"
      - "packages/plugins/scripts/**"
      - "packages/plugin-sdk/**"
      - "apps/computer/src/mcp-manager.ts"
      - "apps/computer/src/plugin-package-cache.ts"
      - "apps/server/src/services/plugin/**"
      - "apps/server/src/services/plugin-service.ts"
      - "apps/server/test/plugin/device-link*"
      - ".github/workflows/whatsapp-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: whatsapp_test
          POSTGRES_PASSWORD: synthetic_local_test
          POSTGRES_DB: whatsapp_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U whatsapp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://whatsapp_test:synthetic_local_test@127.0.0.1:5432/whatsapp_test
      OPENTEAM_TEST_DATABASE_URL: postgresql://whatsapp_test:synthetic_local_test@127.0.0.1:5432/whatsapp_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run db:generate && bun run db:push && bun run prepare:plugins
      - name: Packaged native entry point, adapter lifecycle and shared host gates
        run: >-
          bun test packages/plugins/whatsapp/connector/test
          apps/server/test/plugin/device-link.test.ts
          apps/server/test/plugin/device-link.integration.test.ts
          apps/server/test/plugin/mcp-transport.test.ts
          apps/computer/test/runtime/managed-account-state.test.ts
          apps/computer/test/plugin-package-cache.test.ts
      - run: bun run --cwd packages/plugins typecheck && bun run --cwd packages/plugin-sdk typecheck && bun run --cwd apps/computer typecheck && bun run --cwd apps/server typecheck
