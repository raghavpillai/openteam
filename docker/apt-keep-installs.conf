// Bot apt installs outlive a recreated computer: package lists and downloaded
// .debs stay in the home volume, and every apt run records the packages
// installed beyond the image's own set, for the entrypoint to reinstall.
Dir::Cache::Archives "/home/box/.openteam/apt/archives/";
Dir::State::Lists "/home/box/.openteam/apt/lists/";
APT::Keep-Downloaded-Packages "true";
Binary::apt::APT::Keep-Downloaded-Packages "true";
// The home volume is private to box, so apt's _apt download user can't write there.
APT::Sandbox::User "root";
// Wait for a startup reinstall instead of failing on the lock.
DPkg::Lock::Timeout "300";
APT::Update::Pre-Invoke { "mkdir -p /home/box/.openteam/apt/archives/partial /home/box/.openteam/apt/lists/partial"; };
DPkg::Pre-Invoke { "/usr/local/bin/bun /app/apps/computer/dist/apt-packages-cli.js snapshot || true"; };
DPkg::Post-Invoke { "/usr/local/bin/bun /app/apps/computer/dist/apt-packages-cli.js record || true"; };
