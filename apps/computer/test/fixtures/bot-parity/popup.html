<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Leased Popup Verified</title>
  </head>
  <body>
    <h1>Popup belongs to this browser worker</h1>
    <button type="button" onclick="document.querySelector('output').textContent = 'popup:verified'">
      Verify popup
    </button>
    <output aria-live="polite">waiting</output>
  </body>
</html>
