name: Release OpenBot

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - id: version
        name: Validate release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(bun -e "console.log((await Bun.file('apps/cli/package.json').json()).version)")"
          test "$version" = "$package_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun --filter @openbot/cli typecheck
      - run: bun --filter @openbot/cli test
      - run: bun --filter @openbot/cli build

  images:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: openbot-server
            file: docker/app.Dockerfile
            target: server
          - image: openbot-worker
            file: docker/app.Dockerfile
            target: worker
          - image: openbot-migrate
            file: docker/app.Dockerfile
            target: migrate
          - image: openbot-computer
            file: docker/computer.Dockerfile
            target: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/raghavpillai/${{ matrix.image }}:${{ needs.validate.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  github-release:
    needs: [validate, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release bundle
        run: |
          cp deploy/compose.yaml openbot-compose.yaml
          sha256sum openbot-compose.yaml > SHA256SUMS
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" openbot-compose.yaml SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" openbot-compose.yaml SHA256SUMS --verify-tag --generate-notes --title "OpenBot ${{ needs.validate.outputs.version }}"
          fi

  npm:
    needs: [validate, images, github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun --filter @openbot/cli build
      - name: Publish CLI
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
