# Keep the .deb files dpkg installs from outside apt's cache, and record a
# plain dpkg run (apt's own runs are recorded by its Post-Invoke hook).
pre-invoke="/usr/lib/openteam/bin/bun /app/apps/computer/dist/installs-cli.js dpkg-pre || true"
post-invoke="case ${DPKG_FRONTEND_LOCKED:-no} in no) /usr/lib/openteam/bin/bun /app/apps/computer/dist/installs-cli.js record || true ;; esac"
