name: Release OpenBot

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - id: version
        name: Validate release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for package in apps/cli/package.json apps/server/package.json apps/worker/package.json apps/computer/package.json apps/desktop/package.json; do
            package_version="$(bun -e "console.log((await Bun.file('$package').json()).version)")"
            test "$version" = "$package_version"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun --filter @openbot/cli typecheck
      - run: bun --filter @openbot/cli test
      - run: bun --filter @openbot/cli build
      - run: bun --filter @openbot/desktop typecheck
      - run: bun --filter @openbot/desktop test
      - run: bun --filter @openbot/desktop build
      - run: bun scripts/performance/check-desktop-budgets.ts
      - run: bun --filter @openbot/server typecheck
      - run: bun --filter @openbot/server test
      - run: bun --filter @openbot/worker typecheck
      - run: bun --filter @openbot/worker test
      - run: bun --filter @openbot/computer typecheck
      - run: bun --filter @openbot/computer test
      - run: bun run check:architecture

  images:
    permissions:
      contents: read
      packages: write
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: openbot-server
            file: docker/app.Dockerfile
            target: server
          - image: openbot-worker
            file: docker/app.Dockerfile
            target: worker
          - image: openbot-migrate
            file: docker/app.Dockerfile
            target: migrate
          - image: openbot-computer
            file: docker/computer.Dockerfile
            target: runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/raghavpillai/${{ matrix.image }}:${{ needs.validate.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Record immutable image digest
        shell: bash
        run: |
          mkdir -p image-digests
          echo '${{ steps.build.outputs.digest }}' > 'image-digests/${{ matrix.image }}.digest'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-digest-${{ matrix.image }}
          if-no-files-found: error
          path: image-digests/*.digest

  desktop-linux:
    permissions:
      contents: read
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun --filter @openbot/desktop package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-linux
          if-no-files-found: error
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/latest*.yml
            apps/desktop/release/*.blockmap

  desktop-windows:
    permissions:
      contents: read
    needs: validate
    runs-on: windows-latest
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - name: Require Windows signing credentials
        shell: pwsh
        run: |
          if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD) {
            throw "WINDOWS_CSC_LINK and WINDOWS_CSC_KEY_PASSWORD are required"
          }
      - run: bun install --frozen-lockfile
      - run: bun --filter @openbot/desktop package
      - name: Verify Windows installer signature
        shell: pwsh
        run: |
          $installers = Get-ChildItem apps/desktop/release/*.exe
          if (-not $installers) { throw "No Windows installer was produced" }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($installer.Name): $($signature.Status)"
            }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-windows
          if-no-files-found: error
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest*.yml
            apps/desktop/release/*.blockmap

  desktop-macos:
    permissions:
      contents: read
    needs: validate
    runs-on: macos-latest
    env:
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      CSC_NAME: ${{ secrets.MACOS_CSC_NAME }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun --filter @openbot/desktop package:mac-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-macos
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/latest*.yml
            apps/desktop/release/*.blockmap

  github-release:
    needs: [validate, images, desktop-linux, desktop-windows, desktop-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: desktop-release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-digest-*
          path: image-digests
          merge-multiple: true
      - name: Create release bundle
        run: |
          bun scripts/render-release-compose.ts deploy/compose.yaml openbot-compose.yaml image-digests
          bun apps/cli/scripts/sign-release.ts openbot-compose.yaml desktop-release/*.AppImage
          sha256sum openbot-compose.yaml openbot-compose.yaml.sigstore.json desktop-release/* > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            openbot-compose.yaml
            openbot-compose.yaml.sigstore.json
            desktop-release/*
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" openbot-compose.yaml openbot-compose.yaml.sigstore.json SHA256SUMS desktop-release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" openbot-compose.yaml openbot-compose.yaml.sigstore.json SHA256SUMS desktop-release/* --verify-tag --generate-notes --title "OpenBot ${{ needs.validate.outputs.version }}"
          fi

  npm:
    needs: [validate, images, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun --filter @openbot/cli build
      - name: Publish CLI
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
