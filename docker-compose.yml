name: openbot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openbot
      POSTGRES_USER: openbot
      POSTGRES_PASSWORD: openbot-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbot -d openbot"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    volumes:
      - openbot_postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://openbot:openbot-local-only@postgres:5432/openbot
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  agent-data-init:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 1000:1000 /sand-data && chmod 0700 /sand-data"]
    restart: "no"
    volumes:
      - openbot_agent_data:/sand-data

  asset-store-init:
    image: alpine:3.22
    command:
      - sh
      - -c
      - >-
        mkdir -p /asset-store &&
        if [ -d /sand-data/.openbot ]; then
          migrated=/asset-store/legacy-agent-data-openbot-$(date +%s) &&
          cp -a /sand-data/.openbot "$$migrated" &&
          rm -rf /sand-data/.openbot;
        fi &&
        chown -R 1000:1000 /asset-store && chmod 0700 /asset-store
    depends_on:
      agent-data-init:
        condition: service_completed_successfully
    restart: "no"
    volumes:
      - openbot_agent_data:/sand-data
      - openbot_assets:/asset-store

  computer-home-init:
    image: alpine:3.22
    command:
      - sh
      - -c
      - >-
        chown -R 1000:1000 /home/box && chmod 0700 /home/box &&
        if [ -d /home/box/agent-data ] && [ ! -L /home/box/agent-data ]; then
          cp -a /home/box/agent-data/. /home/box/sand-data/ &&
          mv /home/box/agent-data /home/box/.openbot-agent-data-pre-sand-migration;
        fi &&
        if [ ! -L /home/box/agent-data ]; then ln -s /home/box/sand-data /home/box/agent-data; fi &&
        chown -h 0:0 /home/box/agent-data
    restart: "no"
    volumes:
      - openbot_computer_home:/home/box
      - openbot_agent_data:/home/box/sand-data

  box-store-init:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 1000:1000 /box-store && chmod 0700 /box-store"]
    restart: "no"
    volumes:
      - openbot_box_store:/box-store

  workspace-init:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 1000:1000 /workspace && chmod 0755 /workspace"]
    restart: "no"
    volumes:
      - openbot_workspace:/workspace

  computer:
    build:
      context: .
      dockerfile: docker/computer.Dockerfile
    hostname: openbot
    environment:
      OPENBOT_COMPUTER_PORT: 8790
      OPENBOT_CONTROL_TOKEN: ${OPENBOT_CONTROL_TOKEN:-local-compose-only-change-me}
      OPENBOT_WORKSPACE_ROOT: /workspace
      OPENBOT_TIME_ZONE: ${OPENBOT_TIME_ZONE:-UTC}
      OPENBOT_SERVER_URL: http://server:8787
      OPENBOT_PI_AGENT_DIR: /home/box/.pi/agent
      OPENBOT_PI_MODEL: ${OPENBOT_PI_MODEL:-gpt-5.5}
      OPENBOT_PI_THINKING: ${OPENBOT_PI_THINKING:-high}
      OPENBOT_AGENT_DATA_ROOT: /home/box/agent-data
      OPENBOT_AGENT_DATA_CANONICAL_ROOT: /home/box/sand-data
      OPENBOT_BOX_STORE_ROOT: /box-store
      OPENBOT_BOX_COPY_IN: ${OPENBOT_BOX_COPY_IN:-0}
    depends_on:
      agent-data-init:
        condition: service_completed_successfully
      computer-home-init:
        condition: service_completed_successfully
      box-store-init:
        condition: service_completed_successfully
      workspace-init:
        condition: service_completed_successfully
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8790/health');process.exit(r.ok?0:1)"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    ports:
      - "127.0.0.1:6200-6299:6200-6299"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - openbot_computer_home:/home/box
      - openbot_agent_data:/home/box/sand-data
      - openbot_workspace:/workspace
      - openbot_box_store:/box-store

  server:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: server
    environment:
      DATABASE_URL: postgresql://openbot:openbot-local-only@postgres:5432/openbot
      OPENBOT_PORT: 8787
      OPENBOT_COMPUTER_URL: http://computer:8790
      OPENBOT_CONTROL_TOKEN: ${OPENBOT_CONTROL_TOKEN:-local-compose-only-change-me}
      OPENBOT_AUTH_SECRET: ${OPENBOT_AUTH_SECRET:-local-compose-auth-secret-change-me-now}
      OPENBOT_API_TOKEN: ${OPENBOT_API_TOKEN:-}
      OPENBOT_API_TRUST_LOOPBACK: ${OPENBOT_API_TRUST_LOOPBACK:-true}
      OPENBOT_WORKSPACE_ROOT: /workspace
      OPENBOT_TIME_ZONE: ${OPENBOT_TIME_ZONE:-UTC}
      OPENBOT_PI_MODEL: ${OPENBOT_PI_MODEL:-gpt-5.5}
      OPENBOT_SCREEN_VIEWER_HOST: 127.0.0.1
      OPENBOT_AGENT_DATA_ROOT: /home/box/agent-data
      OPENBOT_ASSET_ROOT: /asset-store
      OPENBOT_MEMORY_DREAMING: ${OPENBOT_MEMORY_DREAMING:-false}
      OPENBOT_MARKETPLACE_FILE: ${OPENBOT_MARKETPLACE_FILE:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      asset-store-init:
        condition: service_completed_successfully
      computer:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8787/api/v0/health');process.exit(r.ok?0:1)"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    volumes:
      - openbot_agent_data:/home/box/agent-data
      - openbot_assets:/asset-store
      - openbot_workspace:/workspace:ro

  worker:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgresql://openbot:openbot-local-only@postgres:5432/openbot
      OPENBOT_COMPUTER_URL: http://computer:8790
      OPENBOT_CONTROL_TOKEN: ${OPENBOT_CONTROL_TOKEN:-local-compose-only-change-me}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      OPENBOT_TIME_ZONE: ${OPENBOT_TIME_ZONE:-UTC}
      OPENBOT_WORKER_CONCURRENCY: ${OPENBOT_WORKER_CONCURRENCY:-8}
      OPENBOT_WORKSPACE_ROOT: /workspace
      OPENBOT_AGENT_DATA_ROOT: /home/box/agent-data
      OPENBOT_ASSET_ROOT: /asset-store
      OPENBOT_MEMORY_DREAMING: ${OPENBOT_MEMORY_DREAMING:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
      asset-store-init:
        condition: service_completed_successfully
      computer:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - openbot_agent_data:/home/box/agent-data
      - openbot_assets:/asset-store
      - openbot_workspace:/workspace:ro

volumes:
  openbot_postgres:
  openbot_computer_home:
  openbot_agent_data:
  openbot_assets:
  openbot_workspace:
  openbot_box_store:
