// Bot apt installs outlive a recreated computer: package lists and downloaded
// .debs stay in the /usr/local volume, and every apt run records the packages
// installed beyond the image's own set, for the entrypoint to reinstall.
Dir::Cache::Archives "/usr/local/var/lib/openteam/apt/archives/";
Dir::State::Lists "/usr/local/var/lib/openteam/apt/lists/";
APT::Keep-Downloaded-Packages "true";
Binary::apt::APT::Keep-Downloaded-Packages "true";
// Wait for a startup reinstall instead of failing on the lock.
DPkg::Lock::Timeout "900";
Binary::apt::DPkg::Lock::Timeout "900";
APT::Update::Pre-Invoke { "mkdir -p /usr/local/var/lib/openteam/apt/archives/partial /usr/local/var/lib/openteam/apt/lists/partial"; };
DPkg::Pre-Invoke { "/usr/lib/openteam/bin/bun /app/apps/computer/dist/installs-cli.js snapshot || true"; };
DPkg::Post-Invoke { "/usr/lib/openteam/bin/bun /app/apps/computer/dist/installs-cli.js record || true"; };
// `apt-get update` runs no dpkg, and is how a bot drops a source it removed.
APT::Update::Post-Invoke { "/usr/lib/openteam/bin/bun /app/apps/computer/dist/installs-cli.js sources || true"; };
