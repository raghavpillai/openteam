<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Grok Browser Parity Fixture</title>
    <style>
      body { font: 16px system-ui, sans-serif; margin: 32px; }
      section { border: 1px solid #aaa; border-radius: 8px; margin: 16px 0; padding: 16px; }
      iframe { width: 520px; height: 150px; }
    </style>
  </head>
  <body>
    <h1>Grok Browser Parity Fixture</h1>
    <section>
      <h2>Open shadow root</h2>
      <parity-panel></parity-panel>
    </section>
    <section>
      <h2>Same-origin iframe</h2>
      <iframe title="Parity child frame" src="./grok-parity-frame.html"></iframe>
    </section>
    <section>
      <h2>Popup lease</h2>
      <button id="open-popup" type="button">Open leased popup</button>
    </section>
    <script>
      customElements.define(
        "parity-panel",
        class extends HTMLElement {
          constructor() {
            super();
            const root = this.attachShadow({ mode: "open" });
            root.innerHTML = `
              <label>Parity value <input aria-label="Shadow parity value" placeholder="type parity value" /></label>
              <button type="button">Commit shadow value</button>
              <output aria-live="polite">waiting</output>
            `;
            root.querySelector("button").addEventListener("click", () => {
              root.querySelector("output").textContent = `shadow:${root.querySelector("input").value}`;
            });
          }
        }
      );
      document.querySelector("#open-popup").addEventListener("click", () => {
        window.open("./grok-parity-popup.html", "parity-popup", "width=520,height=320");
      });
    </script>
  </body>
</html>
