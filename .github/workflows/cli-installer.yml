name: CLI installer

on:
  push:
    paths:
      - "apps/cli/**"
      - "apps/landing/lib/install-script*"
      - ".github/workflows/cli-installer.yml"
  pull_request:
    paths:
      - "apps/cli/**"
      - "apps/landing/lib/install-script*"
      - ".github/workflows/cli-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts --filter @openteam/cli
      - name: Installer rendering and terminal behavior
        run: bun test ./apps/cli/test/setup-countdown.test.ts ./apps/landing/lib/install-script.test.ts
      - name: Native Windows PowerShell and PowerShell 7
        if: runner.os == 'Windows'
        run: |
          python -m pip install pywinpty==3.0.5 pyte==0.8.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Exercise the baseline CPU build used by releases. Extract it with
          # PowerShell so this test does not depend on cross-target extraction.
          $runtimeArchive = Join-Path $env:RUNNER_TEMP 'bun-baseline.zip'
          $runtimeDirectory = Join-Path $env:RUNNER_TEMP 'bun-baseline'
          Invoke-WebRequest 'https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-windows-x64-baseline.zip' -OutFile $runtimeArchive
          Expand-Archive $runtimeArchive -DestinationPath $runtimeDirectory
          $env:OPENTEAM_TEST_BUN_EXECUTABLE = Join-Path $runtimeDirectory 'bun-windows-x64-baseline/bun.exe'
          bun apps/cli/scripts/test-windows-install.ts
      - name: Fresh Linux installation
        if: runner.os == 'Linux'
        run: bun apps/cli/scripts/test-fresh-install.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: installer-${{ runner.os }}
          path: |
            output/windows-install/*.log
            output/windows-install/results.json
            output/fresh-install/results.txt
            output/fresh-install/harness.log
            output/fresh-install/recordings/*.cast
          if-no-files-found: ignore
